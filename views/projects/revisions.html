<!--
    Vista Revisiones del módulo projects (área Cronograma, paso 7a): de R0 a
    la vigente, con la carga de una revisión nueva y la eliminación de la
    última. Exige `pid` en la URL. Fragmento inyectado en #content-area por
    ViewLoader — sin <html>, <head> ni <body>, y sin <script>: la lógica vive
    en src/views-init/projects/revisions.js (la carga, en
    src/utilities/revision-load.js; el encabezado y el menú, en
    src/utilities/project-header.js).
-->
<nav id="project-menu" aria-label="Vistas del proyecto" class="sticky -top-4 z-30 -mx-4 -mt-4 mb-4 flex flex-wrap items-center gap-1 px-4 py-2 bg-navbar border-b border-navbar-line" hidden></nav>

<div id="project-not-found" class="bg-card border border-border rounded-xl" hidden></div>

<!-- Revisiones del cronograma: R0 a la vigente -->
<section id="project-revisions" class="min-w-full bg-card border border-border rounded-xl" aria-labelledby="project-revisions-heading" hidden>
    <header class="flex flex-wrap items-center justify-between gap-2 border-b border-border p-4">
        <h2 id="project-revisions-heading" class="font-semibold">Revisiones del cronograma</h2>
        <button type="button" id="project-revision-load"
                class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border cursor-pointer transition-colors focus:outline-hidden disabled:opacity-50 disabled:pointer-events-none bg-primary text-primary-foreground border-primary-line hover:bg-primary-hover focus:bg-primary-focus">
            <span class="material-symbols-outlined text-base" aria-hidden="true">upload_file</span>
            Cargar revisión…
        </button>
        <input id="project-revision-file" type="file" class="hidden" aria-hidden="true" tabindex="-1">
    </header>
    <div id="project-revisions-table"></div>
</section>

<!-- Modal Preline — Cargar una revisión: vista previa y correspondencia antes de guardar -->
<div id="load-revision"
     class="hs-overlay hs-overlay-open:opacity-100 hs-overlay-open:duration-500 hidden size-full fixed top-0 inset-s-0 z-80 opacity-0 overflow-x-hidden transition-all overflow-y-auto pointer-events-none"
     role="dialog" tabindex="-1" aria-labelledby="load-revision-label">
    <div class="sm:max-w-4xl sm:w-full m-3 sm:mx-auto">
        <div class="flex flex-col bg-overlay border border-overlay-line shadow-2xs rounded-xl pointer-events-auto">

            <div class="flex justify-between items-center py-3 px-4 border-b border-overlay-header">
                <h2 id="load-revision-label" class="font-semibold">Cargar revisión</h2>
                <button type="button"
                        class="size-8 inline-flex justify-center items-center gap-x-2 rounded-full bg-surface border border-surface-line text-surface-foreground hover:bg-surface-hover focus:outline-hidden focus:bg-surface-focus"
                        aria-label="Cerrar" data-hs-overlay="#load-revision">
                    <span class="material-symbols-outlined text-sm" aria-hidden="true">close</span>
                </button>
            </div>

            <div class="p-4 overflow-y-auto text-sm">

                <div class="grid sm:grid-cols-2 gap-4 mb-6">
                    <div>
                        <label for="load-revision-weighting" class="block font-medium mb-2">Criterio de ponderación</label>
                        <select id="load-revision-weighting"
                                class="py-2 px-3 pe-9 block w-full bg-surface border-border rounded-lg text-sm focus:border-primary-focus focus:ring-primary-focus"></select>
                    </div>
                    <div id="load-revision-effective-field">
                        <label for="load-revision-effective" class="block font-medium mb-2">Rige desde</label>
                        <input id="load-revision-effective" type="date" required
                               class="py-2 px-3 block w-44 bg-surface border-border rounded-lg text-sm focus:border-primary-focus focus:ring-primary-focus">
                    </div>
                </div>

                <section aria-labelledby="load-revision-preview-heading">
                    <h3 id="load-revision-preview-heading" class="mb-3 font-semibold">Cronograma</h3>
                    <div id="load-revision-preview" aria-live="polite"></div>
                </section>

                <section id="load-revision-match-section" class="mt-6 pt-4 border-t border-overlay-line" aria-labelledby="load-revision-match-heading">
                    <h3 id="load-revision-match-heading" class="mb-3 font-semibold">Correspondencia de tareas e hitos</h3>
                    <div id="load-revision-match"></div>
                    <!-- Selector único de "Corresponde a": se mueve junto a la fila que se corrige -->
                    <div id="load-revision-picker" class="my-2 p-3 bg-surface border border-border rounded-lg" hidden>
                        <label for="load-revision-picker-search" class="block font-medium mb-2">Corresponde a</label>
                        <input id="load-revision-picker-search" type="search" placeholder="Buscar entre las eliminadas…" autocomplete="off"
                               class="py-2 px-3 block w-full bg-overlay border-border rounded-lg text-sm focus:border-primary-focus focus:ring-primary-focus">
                        <ul id="load-revision-picker-options" class="mt-2 max-h-60 overflow-y-auto divide-y divide-border" role="listbox" aria-label="Tareas e hitos de la revisión anterior"></ul>
                    </div>
                </section>

                <section id="load-revision-progress-section" class="mt-6 pt-4 border-t border-overlay-line" aria-labelledby="load-revision-progress-heading">
                    <h3 id="load-revision-progress-heading" class="mb-3 font-semibold">Avance</h3>
                    <div id="load-revision-progress"></div>
                </section>

            </div>

            <div class="flex justify-end items-center gap-x-3 py-3 px-4 border-t border-overlay-footer">
                <button type="button" class="py-2 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-layer border border-layer-line text-layer-foreground shadow-2xs hover:bg-layer-hover focus:outline-hidden focus:bg-layer-focus disabled:opacity-50 disabled:pointer-events-none" data-hs-overlay="#load-revision">
                    Cancelar
                </button>
                <button type="button" id="load-revision-confirm"
                        class="py-2 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-primary border border-primary-line text-primary-foreground hover:bg-primary-hover focus:outline-hidden focus:bg-primary-focus disabled:opacity-50 disabled:pointer-events-none">
                    Guardar
                </button>
            </div>

        </div>
    </div>
</div>

<!-- Modal Preline — Confirmar la eliminación de la última revisión -->
<div id="delete-revision"
     class="hs-overlay hs-overlay-open:opacity-100 hs-overlay-open:duration-500 hidden size-full fixed top-0 inset-s-0 z-80 opacity-0 overflow-x-hidden transition-all overflow-y-auto pointer-events-none"
     role="dialog" tabindex="-1" aria-labelledby="delete-revision-label">
    <div class="sm:max-w-md sm:w-full m-3 sm:mx-auto">
        <div class="flex flex-col bg-overlay border border-overlay-line shadow-2xs rounded-xl pointer-events-auto">

            <div class="flex justify-between items-center py-3 px-4 border-b border-overlay-header">
                <h2 id="delete-revision-label" class="font-semibold">Eliminar revisión</h2>
                <button type="button"
                        class="size-8 inline-flex justify-center items-center gap-x-2 rounded-full bg-surface border border-surface-line text-surface-foreground hover:bg-surface-hover focus:outline-hidden focus:bg-surface-focus"
                        aria-label="Cerrar" data-hs-overlay="#delete-revision">
                    <span class="material-symbols-outlined text-sm" aria-hidden="true">close</span>
                </button>
            </div>

            <div class="p-4 overflow-y-auto">
                <p class="text-sm">¿Eliminar la revisión <span id="delete-revision-name" class="font-semibold"></span>?</p>
                <p id="delete-revision-detail" class="text-sm mt-2"></p>
                <p class="text-sm mt-2">Esta acción no se puede deshacer.</p>
            </div>

            <div class="flex justify-end items-center gap-x-3 py-3 px-4 border-t border-overlay-footer">
                <button type="button" id="delete-revision-export" class="me-auto whitespace-nowrap py-2 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-layer border border-layer-line text-layer-foreground shadow-2xs hover:bg-layer-hover focus:outline-hidden focus:bg-layer-focus disabled:opacity-50 disabled:pointer-events-none">
                    Exportar antes
                </button>
                <button type="button"
                        class="whitespace-nowrap py-2 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-layer border border-layer-line text-layer-foreground shadow-2xs hover:bg-layer-hover focus:outline-hidden focus:bg-layer-focus disabled:opacity-50 disabled:pointer-events-none"
                        data-hs-overlay="#delete-revision">
                    Cancelar
                </button>
                <button type="button" id="delete-revision-confirm"
                        class="whitespace-nowrap py-2 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-red-500 border border-red-500 text-foreground-inverse hover:bg-red-600 focus:outline-hidden focus:bg-red-600 disabled:opacity-50 disabled:pointer-events-none">
                    Eliminar
                </button>
            </div>

        </div>
    </div>
</div>

<!-- Modal Preline — Advertencias guardadas con una revisión -->
<div id="revision-warnings"
     class="hs-overlay hs-overlay-open:opacity-100 hs-overlay-open:duration-500 hidden size-full fixed top-0 inset-s-0 z-80 opacity-0 overflow-x-hidden transition-all overflow-y-auto pointer-events-none"
     role="dialog" tabindex="-1" aria-labelledby="revision-warnings-label">
    <div class="sm:max-w-2xl sm:w-full m-3 sm:mx-auto">
        <div class="flex flex-col bg-overlay border border-overlay-line shadow-2xs rounded-xl pointer-events-auto">

            <div class="flex justify-between items-center py-3 px-4 border-b border-overlay-header">
                <h2 id="revision-warnings-label" class="font-semibold">Advertencias</h2>
                <button type="button"
                        class="size-8 inline-flex justify-center items-center gap-x-2 rounded-full bg-surface border border-surface-line text-surface-foreground hover:bg-surface-hover focus:outline-hidden focus:bg-surface-focus"
                        aria-label="Cerrar" data-hs-overlay="#revision-warnings">
                    <span class="material-symbols-outlined text-sm" aria-hidden="true">close</span>
                </button>
            </div>

            <div id="revision-warnings-body" class="p-4 overflow-y-auto text-sm"></div>

        </div>
    </div>
</div>
