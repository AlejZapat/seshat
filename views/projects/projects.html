<!--
    Vista Proyectos del módulo projects.
    Fragmento inyectado en #content-area por ViewLoader — sin <html>, <head>
    ni <body>, y sin <script>: la lógica vive en src/views-init/projects/projects.js.
-->
<section class="min-w-full bg-card border border-border rounded-xl">

    <header class="flex flex-wrap items-center justify-between gap-2 border-b border-border p-4">
        <div class="flex flex-wrap items-center gap-2">
            <label for="projects-search" class="sr-only">Buscar proyectos</label>
            <input id="projects-search" type="search" placeholder="Buscar..." autocomplete="off"
                   class="py-2 px-3 block w-56 bg-surface border-border rounded-lg text-sm focus:border-primary-focus focus:ring-primary-focus">

            <label for="projects-status-filter" class="sr-only">Filtrar por estado</label>
            <select id="projects-status-filter"
                    class="py-2 px-3 pe-9 block w-44 bg-surface border-border rounded-lg text-sm focus:border-primary-focus focus:ring-primary-focus"></select>
        </div>

        <!-- Agregar: nuevo proyecto o importar un respaldo (más adelante, crear desde archivo) -->
        <div class="hs-dropdown [--placement:bottom-right] relative inline-flex">
            <button id="projects-add" type="button"
                    class="hs-dropdown-toggle py-2 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-primary border border-primary-line text-primary-foreground hover:bg-primary-hover focus:outline-hidden focus:bg-primary-hover disabled:opacity-50 disabled:pointer-events-none"
                    aria-haspopup="menu" aria-expanded="false">
                <span class="material-symbols-outlined text-sm" aria-hidden="true">add</span>
                Agregar
                <span class="material-symbols-outlined text-sm hs-dropdown-open:rotate-180" aria-hidden="true">expand_more</span>
            </button>
            <div class="hs-dropdown-menu transition-[opacity,margin] duration hs-dropdown-open:opacity-100 opacity-0 hidden min-w-52 z-20 bg-overlay border border-overlay-line shadow-md rounded-lg p-1"
                 role="menu" aria-orientation="vertical" aria-labelledby="projects-add">
                <button type="button" role="menuitem" class="w-full flex items-center gap-x-3 py-2 px-3 rounded-lg text-sm text-layer-foreground hover:bg-layer-hover focus:outline-hidden focus:bg-layer-focus cursor-pointer"
                        aria-haspopup="dialog" aria-controls="new-project" data-hs-overlay="#new-project">
                    <span class="material-symbols-outlined text-base" aria-hidden="true">add</span>
                    Nuevo proyecto
                </button>
                <button type="button" role="menuitem" id="projects-from-file" class="w-full flex items-center gap-x-3 py-2 px-3 rounded-lg text-sm text-layer-foreground hover:bg-layer-hover focus:outline-hidden focus:bg-layer-focus cursor-pointer">
                    <span class="material-symbols-outlined text-base" aria-hidden="true">event_note</span>
                    Desde archivo MPP…
                </button>
                <button type="button" role="menuitem" id="projects-import" class="w-full flex items-center gap-x-3 py-2 px-3 rounded-lg text-sm text-layer-foreground hover:bg-layer-hover focus:outline-hidden focus:bg-layer-focus cursor-pointer">
                    <span class="material-symbols-outlined text-base" aria-hidden="true">upload_file</span>
                    Importar respaldo…
                </button>
            </div>
        </div>
        <input id="projects-import-file" type="file" accept=".seshat" class="hidden" aria-hidden="true" tabindex="-1">
        <input id="projects-schedule-file" type="file" class="hidden" aria-hidden="true" tabindex="-1">
    </header>

    <div id="projects-table"></div>

</section>

<!-- Modal Preline — Confirmar eliminación -->
<div id="delete-project"
     class="hs-overlay hs-overlay-open:opacity-100 hs-overlay-open:duration-500 hidden size-full fixed top-0 inset-s-0 z-80 opacity-0 overflow-x-hidden transition-all overflow-y-auto pointer-events-none"
     role="dialog" tabindex="-1" aria-labelledby="delete-project-label">
    <div class="sm:max-w-md sm:w-full m-3 sm:mx-auto">
        <div class="flex flex-col bg-overlay border border-overlay-line shadow-2xs rounded-xl pointer-events-auto">

            <div class="flex justify-between items-center py-3 px-4 border-b border-overlay-header">
                <h2 id="delete-project-label" class="font-semibold">Eliminar proyecto</h2>
                <button type="button"
                        class="size-8 inline-flex justify-center items-center gap-x-2 rounded-full bg-surface border border-surface-line text-surface-foreground hover:bg-surface-hover focus:outline-hidden focus:bg-surface-focus"
                        aria-label="Cerrar" data-hs-overlay="#delete-project">
                    <span class="material-symbols-outlined text-sm" aria-hidden="true">close</span>
                </button>
            </div>

            <div class="p-4 overflow-y-auto">
                <p class="text-sm">¿Eliminar el proyecto <span id="delete-project-name" class="font-semibold"></span>?</p>
                <p id="delete-project-detail" class="text-sm mt-2"></p>
                <p class="text-sm mt-2">Esta acción no se puede deshacer.</p>
            </div>

            <div class="flex justify-end items-center gap-x-3 py-3 px-4 border-t border-overlay-footer">
                <button type="button" id="delete-project-export" class="me-auto whitespace-nowrap py-2 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-layer border border-layer-line text-layer-foreground shadow-2xs hover:bg-layer-hover focus:outline-hidden focus:bg-layer-focus disabled:opacity-50 disabled:pointer-events-none">
                    Exportar antes
                </button>
                <button type="button"
                        class="whitespace-nowrap py-2 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-layer border border-layer-line text-layer-foreground shadow-2xs hover:bg-layer-hover focus:outline-hidden focus:bg-layer-focus"
                        data-hs-overlay="#delete-project">
                    Cancelar
                </button>
                <button type="button" id="delete-project-confirm"
                        class="whitespace-nowrap py-2 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-red-500 border border-red-500 text-foreground-inverse hover:bg-red-600 focus:outline-hidden focus:bg-red-600 disabled:opacity-50 disabled:pointer-events-none">
                    Eliminar
                </button>
            </div>

        </div>
    </div>
</div>

<!-- Modal Preline — Importar respaldo: vista previa antes de escribir -->
<div id="import-project"
     class="hs-overlay hs-overlay-open:opacity-100 hs-overlay-open:duration-500 hidden size-full fixed top-0 inset-s-0 z-80 opacity-0 overflow-x-hidden transition-all overflow-y-auto pointer-events-none"
     role="dialog" tabindex="-1" aria-labelledby="import-project-label">
    <div class="sm:max-w-md sm:w-full m-3 sm:mx-auto">
        <div class="flex flex-col bg-overlay border border-overlay-line shadow-2xs rounded-xl pointer-events-auto">

            <div class="flex justify-between items-center py-3 px-4 border-b border-overlay-header">
                <h2 id="import-project-label" class="font-semibold">Importar respaldo</h2>
                <button type="button"
                        class="size-8 inline-flex justify-center items-center gap-x-2 rounded-full bg-surface border border-surface-line text-surface-foreground hover:bg-surface-hover focus:outline-hidden focus:bg-surface-focus"
                        aria-label="Cerrar" data-hs-overlay="#import-project">
                    <span class="material-symbols-outlined text-sm" aria-hidden="true">close</span>
                </button>
            </div>

            <div id="import-project-body" class="p-4 overflow-y-auto text-sm" aria-live="polite"></div>

            <div class="flex justify-end items-center gap-x-3 py-3 px-4 border-t border-overlay-footer">
                <button type="button" class="py-2 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-layer border border-layer-line text-layer-foreground shadow-2xs hover:bg-layer-hover focus:outline-hidden focus:bg-layer-focus disabled:opacity-50 disabled:pointer-events-none" data-hs-overlay="#import-project">
                    Cancelar
                </button>
                <button type="button" id="import-project-confirm"
                        class="py-2 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-primary border border-primary-line text-primary-foreground hover:bg-primary-hover focus:outline-hidden focus:bg-primary-focus disabled:opacity-50 disabled:pointer-events-none">
                    Importar
                </button>
            </div>

        </div>
    </div>
</div>

<!-- Modal Preline — Crear proyecto -->
<div id="new-project"
     class="hs-overlay hs-overlay-open:opacity-100 hs-overlay-open:duration-500 hidden size-full fixed top-0 inset-s-0 z-80 opacity-0 overflow-x-hidden transition-all overflow-y-auto pointer-events-none"
     role="dialog" tabindex="-1" aria-labelledby="new-project-label">
    <div id="new-project-dialog" class="sm:max-w-lg sm:w-full m-3 sm:mx-auto">
        <div class="flex flex-col bg-overlay border border-overlay-line shadow-2xs rounded-xl pointer-events-auto">
            <form id="new-project-form" autocomplete="off" novalidate>

                <div class="flex justify-between items-center py-3 px-4 border-b border-overlay-header">
                    <h2 id="new-project-label" class="font-semibold">Nuevo proyecto</h2>
                    <button type="button"
                            class="size-8 inline-flex justify-center items-center gap-x-2 rounded-full bg-surface border border-surface-line text-surface-foreground hover:bg-surface-hover focus:outline-hidden focus:bg-surface-focus"
                            aria-label="Cerrar" data-hs-overlay="#new-project">
                        <span class="material-symbols-outlined text-sm" aria-hidden="true">close</span>
                    </button>
                </div>

                <div class="p-4 overflow-y-auto">

                    <div class="mb-4">
                        <label for="project-type" class="block text-sm font-medium mb-2">Tipo</label>
                        <select id="project-type" name="typeId" required
                                class="py-2 px-3 pe-9 block w-full bg-surface border-border rounded-lg text-sm focus:border-primary-focus focus:ring-primary-focus"></select>
                    </div>

                    <div class="mb-4">
                        <label for="project-code" class="block text-sm font-medium mb-2">Código</label>
                        <input id="project-code" name="code" type="text" maxlength="8" required
                               aria-describedby="project-code-error"
                               class="py-2 px-3 block w-32 bg-surface border-border rounded-lg text-sm uppercase focus:border-primary-focus focus:ring-primary-focus">
                        <p id="project-code-error" class="mt-2 text-sm text-danger hidden" role="alert"></p>
                    </div>

                    <div class="mb-4">
                        <label for="project-name" class="block text-sm font-medium mb-2">Nombre</label>
                        <input id="project-name" name="name" type="text" maxlength="64" required
                               class="py-2 px-3 block w-full bg-surface border-border rounded-lg text-sm focus:border-primary-focus focus:ring-primary-focus">
                    </div>

                    <div class="mb-4">
                        <label for="project-description" class="block text-sm font-medium mb-2">Descripción</label>
                        <textarea id="project-description" name="description" rows="4"
                                  class="py-2 px-3 block w-full bg-surface border-border rounded-lg text-sm focus:border-primary-focus focus:ring-primary-focus"></textarea>
                    </div>

                    <div class="mb-4">
                        <label for="project-currency" class="block text-sm font-medium mb-2">Moneda</label>
                        <select id="project-currency" name="currencyId" required
                                class="py-2 px-3 pe-9 block w-full bg-surface border-border rounded-lg text-sm focus:border-primary-focus focus:ring-primary-focus"></select>
                    </div>

                    <div class="grid sm:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label for="project-status" class="block text-sm font-medium mb-2">Estado</label>
                            <select id="project-status" name="statusId" required
                                    class="py-2 px-3 pe-9 block w-full bg-surface border-border rounded-lg text-sm focus:border-primary-focus focus:ring-primary-focus"></select>
                        </div>
                        <div>
                            <label for="project-priority" class="block text-sm font-medium mb-2">Prioridad</label>
                            <select id="project-priority" name="priorityId" required
                                    class="py-2 px-3 pe-9 block w-full bg-surface border-border rounded-lg text-sm focus:border-primary-focus focus:ring-primary-focus"></select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="project-weighting" class="block text-sm font-medium mb-2">Criterio de ponderación</label>
                        <select id="project-weighting" name="weightingMethod" required
                                aria-describedby="project-weighting-help"
                                class="py-2 px-3 pe-9 block w-full bg-surface border-border rounded-lg text-sm focus:border-primary-focus focus:ring-primary-focus"></select>
                        <p id="project-weighting-help" class="mt-2 text-sm text-muted-foreground">Cómo pesa cada tarea en el avance de las revisiones que se carguen desde ahora.</p>
                    </div>

                    <!-- Solo al crear desde un archivo: vista previa del cronograma (R0) -->
                    <section id="project-file-section" class="mt-6 pt-4 border-t border-overlay-line" hidden aria-labelledby="project-file-heading">
                        <h3 id="project-file-heading" class="mb-3 font-semibold text-sm">Cronograma (R0)</h3>
                        <div id="project-file-preview" class="text-sm" aria-live="polite"></div>
                    </section>

                </div>

                <div class="flex justify-end items-center gap-x-3 py-3 px-4 border-t border-overlay-footer">
                    <button type="button"
                            class="py-2 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-layer border border-layer-line text-layer-foreground shadow-2xs hover:bg-layer-hover focus:outline-hidden focus:bg-layer-focus"
                            data-hs-overlay="#new-project">
                        Cancelar
                    </button>
                    <button type="submit" id="project-form-submit"
                            class="py-2 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-primary border border-primary-line text-primary-foreground hover:bg-primary-hover focus:outline-hidden focus:bg-primary-focus disabled:opacity-50 disabled:pointer-events-none">
                        Crear
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
