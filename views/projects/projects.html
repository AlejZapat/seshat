<!--
    Vista Proyectos del módulo projects.
    Fragmento inyectado en #content-area por ViewLoader — sin <html>, <head>
    ni <body>, y sin <script>: la lógica vive en src/views-init/projects/projects.js.
-->
<section class="min-w-full card">

    <header class="flex flex-wrap items-center justify-between gap-2 border-b border-border p-4">
        <div class="flex flex-wrap items-center gap-2">
            <label for="projects-search" class="sr-only">Buscar proyectos</label>
            <input id="projects-search" type="search" placeholder="Buscar..." autocomplete="off"
                   class="field w-56">

            <label for="projects-status-filter" class="sr-only">Filtrar por estado</label>
            <select id="projects-status-filter"
                    class="field w-44 pe-9"></select>
        </div>

        <!-- Agregar: nuevo proyecto o importar un respaldo (más adelante, crear desde archivo) -->
        <div class="hs-dropdown [--placement:bottom-right] relative inline-flex">
            <button id="projects-add" type="button"
                    class="hs-dropdown-toggle btn btn-primary"
                    aria-haspopup="menu" aria-expanded="false">
                <span class="material-symbols-outlined" aria-hidden="true">add</span>
                Agregar
                <span class="material-symbols-outlined text-sm hs-dropdown-open:rotate-180" aria-hidden="true">expand_more</span>
            </button>
            <div class="hs-dropdown-menu transition-[opacity,margin] duration hs-dropdown-open:opacity-100 opacity-0 hidden menu min-w-52 z-20"
                 role="menu" aria-orientation="vertical" aria-labelledby="projects-add">
                <button type="button" role="menuitem" class="menu-item"
                        aria-haspopup="dialog" aria-controls="new-project" data-hs-overlay="#new-project">
                    <span class="material-symbols-outlined" aria-hidden="true">add</span>
                    Nuevo proyecto
                </button>
                <button type="button" role="menuitem" id="projects-from-file" class="menu-item">
                    <span class="material-symbols-outlined" aria-hidden="true">event_note</span>
                    Desde archivo MPP…
                </button>
                <button type="button" role="menuitem" id="projects-import" class="menu-item">
                    <span class="material-symbols-outlined" aria-hidden="true">upload_file</span>
                    Importar respaldo…
                </button>
                <button type="button" role="menuitem" id="projects-wizard" class="menu-item">
                    <span class="material-symbols-outlined" aria-hidden="true">assistant_navigation</span>
                    Con asistente…
                </button>
            </div>
        </div>
        <input id="projects-import-file" type="file" accept=".seshat" class="hidden" aria-hidden="true" tabindex="-1">
        <input id="projects-schedule-file" type="file" class="hidden" aria-hidden="true" tabindex="-1">
    </header>

    <div id="projects-table"></div>

</section>

<!-- Modal Preline — Confirmar eliminación -->
<div id="delete-project"
     class="hs-overlay hs-overlay-open:opacity-100 hs-overlay-open:duration-500 hidden size-full fixed top-0 inset-s-0 z-80 opacity-0 overflow-x-hidden transition-all overflow-y-auto pointer-events-none"
     role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="delete-project-label">
    <div class="dialog-sm">
        <div class="dialog">

            <div class="dialog-header">
                <h2 id="delete-project-label" class="dialog-title">Eliminar proyecto</h2>
                <button type="button"
                        class="btn btn-ghost btn-icon text-muted-foreground-1 hover:text-foreground"
                        aria-label="Cerrar" title="Cerrar" data-hs-overlay="#delete-project">
                    <span class="material-symbols-outlined" aria-hidden="true">close</span>
                </button>
            </div>

            <div class="dialog-body">
                <p class="text-sm">¿Eliminar el proyecto <span id="delete-project-name" class="font-semibold"></span>?</p>
                <p id="delete-project-detail" class="text-sm mt-2"></p>
                <p class="text-sm mt-2">Esta acción no se puede deshacer.</p>
            </div>

            <div class="dialog-footer">
                <button type="button" id="delete-project-export" class="me-auto whitespace-nowrap btn btn-outline">
                    Exportar antes
                </button>
                <button type="button"
                        class="whitespace-nowrap btn btn-outline"
                        data-hs-overlay="#delete-project">
                    Cancelar
                </button>
                <button type="button" id="delete-project-confirm"
                        class="whitespace-nowrap btn btn-danger">
                    Eliminar
                </button>
            </div>

        </div>
    </div>
</div>

<!-- Modal Preline — Importar respaldo: vista previa antes de escribir -->
<div id="import-project"
     class="hs-overlay hs-overlay-open:opacity-100 hs-overlay-open:duration-500 hidden size-full fixed top-0 inset-s-0 z-80 opacity-0 overflow-x-hidden transition-all overflow-y-auto pointer-events-none"
     role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="import-project-label">
    <div class="dialog-md">
        <div class="dialog">

            <div class="dialog-header">
                <h2 id="import-project-label" class="dialog-title">Importar respaldo</h2>
                <button type="button"
                        class="btn btn-ghost btn-icon text-muted-foreground-1 hover:text-foreground"
                        aria-label="Cerrar" title="Cerrar" data-hs-overlay="#import-project">
                    <span class="material-symbols-outlined" aria-hidden="true">close</span>
                </button>
            </div>

            <div id="import-project-body" class="dialog-body text-sm" aria-live="polite"></div>

            <div class="dialog-footer">
                <button type="button" class="btn btn-outline" data-hs-overlay="#import-project">
                    Cancelar
                </button>
                <button type="button" id="import-project-confirm"
                        class="btn btn-primary">
                    Importar
                </button>
            </div>

        </div>
    </div>
</div>

<!-- Modal Preline — Crear proyecto -->
<div id="new-project"
     class="hs-overlay hs-overlay-open:opacity-100 hs-overlay-open:duration-500 hidden size-full fixed top-0 inset-s-0 z-80 opacity-0 overflow-x-hidden transition-all overflow-y-auto pointer-events-none"
     role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="new-project-label">
    <div id="new-project-dialog" class="dialog-md">
        <div class="dialog">
            <form id="new-project-form" autocomplete="off" novalidate>

                <div class="dialog-header">
                    <h2 id="new-project-label" class="dialog-title">Nuevo proyecto</h2>
                    <button type="button"
                            class="btn btn-ghost btn-icon text-muted-foreground-1 hover:text-foreground"
                            aria-label="Cerrar" title="Cerrar" data-hs-overlay="#new-project">
                        <span class="material-symbols-outlined" aria-hidden="true">close</span>
                    </button>
                </div>

                <div class="dialog-body">

                    <div class="mb-4">
                        <label for="project-type" class="field-label">Tipo</label>
                        <select id="project-type" name="typeId" required
                                class="field pe-9"></select>
                    </div>

                    <div class="mb-4">
                        <label for="project-code" class="field-label">Código</label>
                        <input id="project-code" name="code" type="text" maxlength="8" required
                               aria-describedby="project-code-error"
                               class="field w-32 uppercase"> <!-- ui-check-ignore mayusculas: el código se escribe en mayúsculas, es formato del dato -->
                        <p id="project-code-error" class="mt-2 text-sm text-danger-text hidden" role="alert"></p>
                    </div>

                    <div class="mb-4">
                        <label for="project-name" class="field-label">Nombre</label>
                        <input id="project-name" name="name" type="text" maxlength="64" required
                               class="field">
                    </div>

                    <div class="mb-4">
                        <label for="project-description" class="field-label">Descripción</label>
                        <textarea id="project-description" name="description" rows="4"
                                  class="field"></textarea>
                    </div>

                    <div class="mb-4">
                        <label for="project-currency" class="field-label">Moneda</label>
                        <select id="project-currency" name="currencyId" required
                                class="field pe-9"></select>
                    </div>

                    <div class="grid sm:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label for="project-status" class="field-label">Estado</label>
                            <select id="project-status" name="statusId" required
                                    class="field pe-9"></select>
                        </div>
                        <div>
                            <label for="project-priority" class="field-label">Prioridad</label>
                            <select id="project-priority" name="priorityId" required
                                    class="field pe-9"></select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="project-weighting" class="field-label">Criterio de ponderación</label>
                        <select id="project-weighting" name="weightingMethod" required
                                aria-describedby="project-weighting-help"
                                class="field pe-9"></select>
                        <p id="project-weighting-help" class="mt-2 text-sm text-muted-foreground-1">Cómo pesa cada tarea en el avance de las revisiones que se carguen desde ahora.</p>
                    </div>

                    <!-- Solo al crear desde un archivo: vista previa del cronograma (R0) -->
                    <section id="project-file-section" class="mt-6 pt-4 border-t border-overlay-line" hidden aria-labelledby="project-file-heading">
                        <h3 id="project-file-heading" class="mb-3 font-semibold text-sm">Cronograma (R0)</h3>
                        <div id="project-file-preview" class="text-sm" aria-live="polite"></div>
                    </section>

                </div>

                <div class="dialog-footer">
                    <button type="button"
                            class="btn btn-outline"
                            data-hs-overlay="#new-project">
                        Cancelar
                    </button>
                    <button type="submit" id="project-form-submit"
                            class="btn btn-primary">
                        Crear
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
