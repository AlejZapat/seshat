<!--
    @file views/404.html
    @description Vista de error 404 — página no encontrada.
    Cargada por Loader cuando el fetch de una vista falla.
-->
<div class="flex flex-col items-center justify-center h-full text-center gap-4">
    <h1 class="text-8xl font-semibold">404</h1>
    <h2 class="text-3xl font-medium text-foreground">Página no encontrada</h2>
    <p class="text-md text-muted-foreground mt-1">La vista que buscas no existe o fue movida.</p>
    <a href="./" class="py-2 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-primary border border-primary-line text-primary-foreground hover:bg-primary-hover">Volver al inicio</a>
</div>
